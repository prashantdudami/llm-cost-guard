[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-cost-guard"
version = "0.3.0"
description = "Real-time cost tracking, budget enforcement, and usage analytics for LLM applications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Prashant Dudami", email = "prashant.dudami@gmail.com" }
]
keywords = [
    "llm",
    "cost-tracking",
    "budget",
    "openai",
    "anthropic",
    "bedrock",
    "langchain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "tiktoken>=0.5.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
# LLM Providers
anthropic = ["anthropic>=0.18.0"]
bedrock = ["boto3>=1.28.0"]
langchain = ["langchain>=0.1.0", "langchain-core>=0.1.0"]

# Storage Backends
sql = ["sqlalchemy>=2.0.0"]
redis = ["redis>=4.5.0"]

# Encryption (cloud-agnostic)
encryption = ["cryptography>=41.0.0"]

# Secrets Providers
vault = ["hvac>=1.0.0"]

# Cloud-specific (optional)
aws = ["boto3>=1.28.0"]
gcp = ["google-cloud-secret-manager>=2.0.0"]
azure = ["azure-keyvault-secrets>=4.0.0", "azure-identity>=1.0.0"]

# Observability (standard protocols)
prometheus = ["prometheus-client>=0.17.0"]
statsd = ["statsd>=4.0.0"]
otel = ["opentelemetry-api>=1.20.0", "opentelemetry-sdk>=1.20.0"]

# All cloud-agnostic features
full = [
    "llm-cost-guard[encryption,prometheus,otel,redis,sql]"
]

# All features including cloud providers
all = [
    "llm-cost-guard[anthropic,bedrock,langchain,sql,redis,encryption,vault,prometheus,otel]"
]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "moto>=4.2.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "bandit>=1.7.0",
    "cryptography>=41.0.0",
    "redis>=4.5.0",
    "prometheus-client>=0.17.0",
]

[project.scripts]
llm-cost-guard = "llm_cost_guard.cli:main"

[project.urls]
Homepage = "https://github.com/prashantdudami/llm-cost-guard"
Documentation = "https://github.com/prashantdudami/llm-cost-guard#readme"
Repository = "https://github.com/prashantdudami/llm-cost-guard"
Issues = "https://github.com/prashantdudami/llm-cost-guard/issues"
Author = "https://www.prashantdudami.com/"

[tool.hatch.build.targets.wheel]
packages = ["llm_cost_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=llm_cost_guard --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
